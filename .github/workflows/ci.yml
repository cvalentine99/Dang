# Continuous integration for Dang! SIEM.
#
# Replaces the former committed "CI proof" artifact (docs/ci-proof-artifact.md,
# removed 2026-10-21): results now come from this workflow, on every push and PR.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, audits, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dang_test
          MYSQL_USER: dang
          MYSQL_PASSWORD: dang
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      CI: "true"
      TZ: UTC
      # Test-only secret; tests sign and verify their own JWTs.
      JWT_SECRET: ci-test-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@10.34.7)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit + client tests (no database)
        run: pnpm test

      - name: Source checks (quarantined source-text assertions)
        run: pnpm test:source-checks

      - name: Dependency audit (production, high+)
        run: pnpm audit --audit-level=high --prod

      - name: Broker parameter counts vs Wazuh spec
        run: pnpm audit:broker

      - name: drizzle-kit check (migration chain)
        env:
          DATABASE_URL: mysql://dang:dang@127.0.0.1:3306/dang_test
        run: pnpm db:check

      # globalSetup applies ./drizzle migrations to dang_test, then the
      # DB-gated suites run (including server/migrations.apply.test.ts).
      - name: DB-gated tests (MySQL 8.4)
        env:
          DATABASE_URL: mysql://dang:dang@127.0.0.1:3306/dang_test
        run: pnpm test:db

      # Suites that never ran before H-T1 and fail on a fresh DB — listed in
      # vitest.workspace.ts (DB_KNOWN_FAILING). Visible, not blocking.
      - name: DB-gated tests — known-failing burn-down (non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: mysql://dang:dang@127.0.0.1:3306/dang_test
        run: pnpm test:db:known-failing

  docker:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dang-siem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
